[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookingguard"
version = "0.1.0"
description = "AI-powered booking change assurance for maritime logistics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ui = [
    "streamlit>=1.30",
]

[project.scripts]
bookingguard = "bookingguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bookingguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
